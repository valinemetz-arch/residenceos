<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="landscapeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F3810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A876;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FAFAF8" stroke="url(#landscapeGradient)" stroke-width="2"/>

  <!-- Landscape/Map Element -->
  <!-- Mountains -->
  <path d="M 40 120 L 70 70 L 85 90 L 110 50 L 140 85 L 160 120 Z" fill="url(#landscapeGradient)" opacity="0.9"/>

  <!-- Mountain highlights -->
  <path d="M 65 90 L 75 75 L 80 90 Z" fill="#3D6B1F" opacity="0.6"/>
  <path d="M 115 70 L 130 55 L 140 75 Z" fill="#3D6B1F" opacity="0.6"/>

  <!-- Rolling hills - secondary color -->
  <ellipse cx="55" cy="135" rx="20" ry="12" fill="url(#accentGradient)" opacity="0.7"/>
  <ellipse cx="130" cy="140" rx="22" ry="14" fill="url(#accentGradient)" opacity="0.6"/>

  <!-- Landscape path/road -->
  <path d="M 100 150 Q 85 135 75 120" stroke="#8B6F47" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Water/reflection line -->
  <path d="M 40 145 Q 100 155 160 145" stroke="#2D5016" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="3,2"/>

  <!-- Decorative elements - compass/map markers -->
  <circle cx="70" cy="105" r="2.5" fill="#C9A876"/>
  <circle cx="120" cy="95" r="2.5" fill="#C9A876"/>

  <!-- Tree indicators (small dots) -->
  <circle cx="85" cy="125" r="1.5" fill="#3D6B1F"/>
  <circle cx="145" cy="130" r="1.5" fill="#3D6B1F"/>

  <!-- Subtle accent lines for depth -->
  <line x1="50" y1="130" x2="65" y2="120" stroke="#8B6F47" stroke-width="0.8" opacity="0.4"/>
  <line x1="140" y1="125" x2="155" y2="115" stroke="#8B6F47" stroke-width="0.8" opacity="0.4"/>
</svg>
